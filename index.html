<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="loginMessage"></p>

    <a href="signup.html">
        Don't have an account? Signup
    </a>

</div>


<script src="script.js"></script>

</body>

</html>
