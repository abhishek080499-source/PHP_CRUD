<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <form id="signupForm">

            <input
                type="text"
                name="name"
                placeholder="Enter name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Signup
            </button>

        </form>

        <p id="signupMessage"></p>

        <a href="index.html">
            Already have an account? Login
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
